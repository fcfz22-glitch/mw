<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="跨平台兼容的 HTML5 计算器">
<title>计算器</title>
<style>
/* ---- Reset & 基础 ---- */
html, body, div, h1, button { margin: 0; padding: 0; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  /* 仅调用操作系统自带的本地字体（无 @font-face、无网络字体、无版权风险）：
     Windows: 微软雅黑 / Segoe UI；macOS/iOS: 苹方 / PingFang SC / San Francisco；
     Linux: Noto Sans CJK / 文泉驿；Android: 思源黑体 / Noto Sans CJK */
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Segoe UI Variable",
               Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
               "Microsoft YaHei UI", "Source Han Sans SC", "Noto Sans CJK SC",
               "WenQuanYi Micro Hei", "Droid Sans Fallback",
               system-ui, "Helvetica", sans-serif;
  background: #0f172a;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
  color: #e2e8f0;
  min-height: 100vh;
  min-height: 100dvh;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-align: center;
      -ms-flex-align: center;
          align-items: center;
  -webkit-box-pack: center;
      -ms-flex-pack: center;
          justify-content: center;
  padding: 20px;
  overflow-x: hidden;
}
/* ---- 计算器容器 ---- */
main.calculator {
  background: #1e293b;
  background: -webkit-linear-gradient(top, #1e293b, #172033);
  background: linear-gradient(180deg, #1e293b, #172033);
  border-radius: 20px;
  -webkit-border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 340px;
  -webkit-box-shadow: 0 20px 60px rgba(0,0,0,.5);
          box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
h1 {
  font-size: 18px;
  line-height: 1.4;
  margin-bottom: 16px;
  text-align: center;
  color: #38bdf8;
}
/* ---- 显示屏 ---- */
.output {
  background: #0b1220;
  border: 1px solid #1e293b;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  text-align: right;
  min-height: 76px;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
      -ms-flex-direction: column;
          flex-direction: column;
  -webkit-box-pack: center;
      -ms-flex-pack: center;
          justify-content: center;
  word-wrap: break-word;
  word-break: break-all;
}
#expr {
  font-size: 15px;
  color: #94a3b8;
  min-height: 20px;
  -webkit-user-select: none;
     -moz-user-select: none;
      -ms-user-select: none;
          user-select: none;
}
#result {
  font-size: 30px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  -moz-font-feature-settings: "tnum";
  -webkit-font-feature-settings: "tnum";
  -webkit-user-select: none;
     -moz-user-select: none;
      -ms-user-select: none;
          user-select: none;
}
/* ---- 按键区 ---- */
.keys {
  display: -webkit-box;
  display: -ms-flexbox;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.keys button {
  padding: 16px 0;
  font-size: 18px;
  font-family: inherit;
  border: none;
  border-radius: 10px;
  background: #334155;
  color: #e2e8f0;
  cursor: pointer;
  -webkit-user-select: none;
     -moz-user-select: none;
      -ms-user-select: none;
          user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-transition: background .2s, -webkit-transform .1s;
  transition: background .2s, transform .1s;
  touch-action: manipulation;
}
.keys button:hover { background: #475569; }
.keys button:active { -webkit-transform: scale(.95); transform: scale(.95); }
.keys button:focus-visible {
  outline: 2px solid #38bdf8;
  outline-offset: 2px;
}
.keys .op { background: #0369a1; }
.keys .op:hover { background: #0284c7; }
.keys .eq {
  background: #38bdf8;
  color: #0f172a;
  font-weight: bold;
}
.keys .eq:hover { background: #7dd3fc; }
.keys .clear { background: #be123c; }
.keys .clear:hover { background: #e11d48; }
/* 老浏览器网格回退 */
@supports not (display: grid) {
  .keys { display: -webkit-box; display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap; }
  .keys button { -webkit-box-flex: 1; -ms-flex: 1 1 20%; flex: 1 1 20%; margin: 4px; }
}
/* ---- 历史记录（localStorage 缓存） ---- */
.history {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid #334155;
}
.history-head {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-pack: justify;
      -ms-flex-pack: justify;
          justify-content: space-between;
  -webkit-box-align: center;
      -ms-flex-align: center;
          align-items: center;
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 8px;
}
.hist-clear {
  background: transparent;
  border: none;
  color: #f87171;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  -webkit-tap-highlight-color: transparent;
}
.hist-clear:hover { background: rgba(248,113,113,.15); }
#historyList {
  list-style: none;
  max-height: 156px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch; /* iOS 平滑滚动 */
}
#historyList li {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-pack: justify;
      -ms-flex-pack: justify;
          justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  background: #0b1220;
  margin-bottom: 6px;
  font-size: 14px;
  cursor: pointer;
}
#historyList li:hover { background: #1e293b; }
#historyList .h-expr {
  color: #94a3b8;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#historyList .h-res {
  color: #38bdf8;
  font-weight: 600;
  -webkit-flex-shrink: 0;
      -ms-flex-negative: 0;
          flex-shrink: 0;
}
#historyList li.h-empty {
  background: transparent;
  color: #64748b;
  font-size: 13px;
  text-align: center;
  -webkit-box-pack: center;
      -ms-flex-pack: center;
          justify-content: center;
  cursor: default;
}
#historyList li.h-empty:hover { background: transparent; }
</style>
</head>
<body>
<main class="calculator" role="application" aria-label="计算器">
  <h1>⚡ 计算器</h1>
  <div class="output" aria-live="polite" aria-atomic="true">
    <div id="expr">&nbsp;</div>
    <div id="result">0</div>
  </div>
  <div class="keys">
    <button type="button" class="clear" data-action="clear" aria-label="清除">C</button>
    <button type="button" data-action="input" data-value="(">(</button>
    <button type="button" data-action="input" data-value=")">)</button>
    <button type="button" class="op" data-action="input" data-value="÷" aria-label="除">÷</button>

    <button type="button" data-action="input" data-value="7">7</button>
    <button type="button" data-action="input" data-value="8">8</button>
    <button type="button" data-action="input" data-value="9">9</button>
    <button type="button" class="op" data-action="input" data-value="×" aria-label="乘">×</button>

    <button type="button" data-action="input" data-value="4">4</button>
    <button type="button" data-action="input" data-value="5">5</button>
    <button type="button" data-action="input" data-value="6">6</button>
    <button type="button" class="op" data-action="input" data-value="−" aria-label="减">−</button>

    <button type="button" data-action="input" data-value="1">1</button>
    <button type="button" data-action="input" data-value="2">2</button>
    <button type="button" data-action="input" data-value="3">3</button>
    <button type="button" class="op" data-action="input" data-value="+" aria-label="加">+</button>

    <button type="button" data-action="input" data-value="0">0</button>
    <button type="button" data-action="input" data-value=".">.</button>
    <button type="button" data-action="backspace" aria-label="退格">⌫</button>
    <button type="button" class="eq" data-action="equals" aria-label="等于">=</button>
  </div>
  <section class="history" aria-label="历史记录">
    <div class="history-head">
      <span>历史记录</span>
      <button type="button" class="hist-clear" id="histClear" aria-label="清空历史记录">清空</button>
    </div>
    <ul id="historyList"></ul>
  </section>
</main>
<script>
(function () {
  'use strict';

  var exprEl = document.getElementById('expr');
  var resultEl = document.getElementById('result');
  var historyListEl = document.getElementById('historyList');
  var histClearEl = document.getElementById('histClear');

  var expr = '';            // 当前输入的表达式
  var lastResult = '0';     // 上一次结果
  var justEvaluated = false;

  // ---- 历史记录缓存（localStorage，含不可用时的内存回退） ----
  var STORE_KEY = 'html5_calc_history_v1';
  var MAX_HISTORY = 50;
  var storageOK = (function () {
    try {
      var k = '__calc_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  })();
  var memoryHistory = [];   // localStorage 不可用（如隐私模式）时的回退缓存

  function loadHistory() {
    if (storageOK) {
      try {
        var raw = window.localStorage.getItem(STORE_KEY);
        var list = raw ? JSON.parse(raw) : [];
        return Object.prototype.toString.call(list) === '[object Array]' ? list : [];
      } catch (e) { return []; }
    }
    return memoryHistory;
  }

  function saveHistory(list) {
    if (storageOK) {
      try { window.localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
      catch (e) { /* 配额满时静默降级 */ }
    } else {
      memoryHistory = list;
    }
  }

  var history = loadHistory();

  function addHistoryItem(text, result) {
    history.unshift({ t: text, r: result });
    if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
    saveHistory(history);
    renderHistory();
  }

  function renderHistory() {
    // 清空列表（避免 innerHTML 在老浏览器的兼容问题，用 DOM API）
    while (historyListEl.firstChild) historyListEl.removeChild(historyListEl.firstChild);

    if (!history.length) {
      var empty = document.createElement('li');
      empty.className = 'h-empty';
      empty.appendChild(document.createTextNode('暂无记录'));
      historyListEl.appendChild(empty);
      return;
    }
    for (var i = 0; i < history.length; i++) {
      var item = history[i];
      var li = document.createElement('li');
      li.setAttribute('data-index', String(i));
      li.setAttribute('title', '点击可重新载入该表达式');

      var t = document.createElement('span');
      t.className = 'h-expr';
      t.appendChild(document.createTextNode(item.t));

      var r = document.createElement('span');
      r.className = 'h-res';
      r.appendChild(document.createTextNode('= ' + item.r));

      li.appendChild(t);
      li.appendChild(r);
      historyListEl.appendChild(li);
    }
  }

  // 点击历史条目：重新载入表达式（事件委托）
  function onHistoryClick(e) {
    e = e || window.event;
    var target = e.target || e.srcElement;
    while (target && target !== historyListEl && !(target.getAttribute && target.getAttribute('data-index'))) {
      target = target.parentNode;
    }
    if (!target || target === historyListEl) return;
    var idx = parseInt(target.getAttribute('data-index'), 10);
    var item = history[idx];
    if (!item) return;
    expr = item.t;
    justEvaluated = false;
    render();
  }

  if (historyListEl.addEventListener) {
    historyListEl.addEventListener('click', onHistoryClick, false);
  } else if (historyListEl.attachEvent) {
    historyListEl.attachEvent('onclick', onHistoryClick);
  }

  // 清空历史
  function clearHistory() {
    history = [];
    saveHistory(history);
    renderHistory();
  }
  if (histClearEl.addEventListener) {
    histClearEl.addEventListener('click', clearHistory, false);
  } else if (histClearEl.attachEvent) {
    histClearEl.attachEvent('onclick', clearHistory);
  }

  // ---- 工具函数 ----
  function toPlain(s) {
    return s.replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/−/g, '-');
  }

  function isNumericKey(k) { return k >= '0' && k <= '9'; }

  function formatNumber(n) {
    if (!isFinite(n)) return '错误';
    if (Math.abs(n) > 1e15 || (Math.abs(n) < 1e-7 && n !== 0)) {
      return n.toExponential(8).replace(/\.?0+e/, 'e');
    }
    // 四舍五入到 10 位小数，消除浮点误差
    var r = Math.round(n * 1e10) / 1e10;
    return String(r);
  }

  // 安全求值：仅允许数字与四则运算括号，不使用 eval
  function evaluate(input) {
    var tokens = input.match(/\d+(\.\d+)?|[+\-*/()]/g);
    if (!tokens) return null;
    var output = [];
    var ops = [];
    var prev = '';
    var i, t;

    function prec(op) {
      if (op === 'neg') return 3;   // 一元负号优先级最高
      if (op === '+' || op === '-') return 1;
      if (op === '*' || op === '/') return 2;
      return 0;
    }
    function isValue(tok) { return /^[\d.]+$/.test(tok); }
    // 一元位置：表达式开头、左括号后、运算符后
    function isUnaryPos(p) {
      return p === '' || p === '(' || (p !== '' && '+-*/'.indexOf(p) >= 0);
    }

    // 后缀转换（Shunting-yard）
    for (i = 0; i < tokens.length; i++) {
      t = tokens[i];
      if (isValue(t)) {
        if (t.split('.').length > 2) return null;
        output.push(t);
      } else if (t === '(') {
        ops.push(t);
      } else if (t === ')') {
        while (ops.length && ops[ops.length - 1] !== '(') output.push(ops.pop());
        if (!ops.length) return null;
        ops.pop();
      } else if (t === '-' && isUnaryPos(prev)) {
        // 一元负号：独立 'neg' 标记，高优先级、右结合，不弹出已有运算符
        ops.push('neg');
      } else if (t === '+' && isUnaryPos(prev)) {
        // 一元加号：直接忽略（如 5−+3 → 5−3）
      } else {
        while (ops.length && prec(ops[ops.length - 1]) >= prec(t)) output.push(ops.pop());
        ops.push(t);
      }
      prev = t;
    }
    while (ops.length) {
      var op = ops.pop();
      if (op === '(') return null;
      output.push(op);
    }

    // 计算后缀表达式
    var stack = [];
    for (i = 0; i < output.length; i++) {
      t = output[i];
      if (isValue(t)) {
        stack.push(parseFloat(t));
      } else if (t === 'neg') {
        if (stack.length < 1) return null;
        stack.push(-stack.pop());
      } else {
        if (stack.length < 2) return null;
        var b = stack.pop();
        var a = stack.pop();
        if (t === '+') stack.push(a + b);
        else if (t === '-') stack.push(a - b);
        else if (t === '*') stack.push(a * b);
        else if (t === '/') { if (b === 0) return null; stack.push(a / b); }
      }
    }
    if (stack.length !== 1) return null;
    return stack[0];
  }

  // ---- 渲染 ----
  function render() {
    exprEl.textContent = expr || '\u00A0';
    if (expr === '') {
      resultEl.textContent = lastResult;
    } else if (!justEvaluated) {
      resultEl.textContent = expr;
    }
  }

  // ---- 操作 ----
  function inputChar(c) {
    if (justEvaluated) {
      if (/[\d.]/.test(c)) { expr = ''; }
      else { expr = lastResult; }
      justEvaluated = false;
    }
    // 连续运算符时替换上一个
    if (/[+\-×÷]/.test(c)) {
      if (expr === '' && c !== '-') { return; }
      if (/[+\-×÷]$/.test(expr)) {
        expr = expr.slice(0, -1) + c;
        render();
        return;
      }
    }
    if (c === '.') {
      // 分段取当前数字：须同时按 ASCII '-' 与全角 '−'(U+2212) 切分，
      // 否则负号后的数字无法输入小数点
      var tail = expr.split(/[+\-×÷()−]/).pop();
      if (tail.indexOf('.') >= 0) return; // 同一数字只允许一个小数点
      if (tail === '') c = '0.';
    }
    if (expr.length >= 32) return;
    expr += c;
    render();
  }

  function clearAll() {
    expr = '';
    lastResult = '0';
    justEvaluated = false;
    render();
  }

  function backspace() {
    if (justEvaluated) { justEvaluated = false; }
    expr = expr.slice(0, -1);
    render();
  }

  function equals() {
    if (!expr) return;
    var val = evaluate(toPlain(expr));
    if (val === null) {
      resultEl.textContent = '错误';
      expr = '';
      exprEl.textContent = '\u00A0';
      justEvaluated = true;
      return;
    }
    lastResult = formatNumber(val);
    exprEl.textContent = expr + ' =';
    resultEl.textContent = lastResult;
    addHistoryItem(expr, lastResult);   // 写入缓存历史
    expr = '';
    justEvaluated = true;
  }

  // ---- 事件绑定（事件委托，兼容老浏览器） ----
  var keys = document.querySelector('.keys');
  if (keys.addEventListener) {
    keys.addEventListener('click', onKeyClick, false);
  } else if (keys.attachEvent) {
    keys.attachEvent('onclick', onKeyClick); // IE8 回退
  }

  function onKeyClick(e) {
    e = e || window.event;
    var target = e.target || e.srcElement;
    while (target && target !== keys && !target.getAttribute('data-action')) {
      target = target.parentNode;
    }
    if (!target || target === keys) return;
    var action = target.getAttribute('data-action');
    if (action === 'input') inputChar(target.getAttribute('data-value'));
    else if (action === 'clear') clearAll();
    else if (action === 'backspace') backspace();
    else if (action === 'equals') equals();
  }

  // ---- 键盘支持 ----
  function onKeydown(e) {
    e = e || window.event;
    var k = e.key || String.fromCharCode(e.keyCode || e.which);
    if (isNumericKey(k) || k === '.' || k === '(' || k === ')' ||
        k === '+' || k === '-' || k === '*' || k === '/') {
      var map = { '*': '×', '/': '÷', '-': '−' };
      inputChar(map[k] || k);
      if (e.preventDefault) e.preventDefault();
    } else if (k === 'Enter' || k === '=' || e.keyCode === 13) {
      equals();
      if (e.preventDefault) e.preventDefault();
    } else if (k === 'Backspace' || e.keyCode === 8) {
      backspace();
      if (e.preventDefault) e.preventDefault();
    } else if (k === 'Escape' || e.keyCode === 27) {
      clearAll();
    }
  }
  if (document.addEventListener) {
    document.addEventListener('keydown', onKeydown, false);
  } else if (document.attachEvent) {
    document.attachEvent('onkeydown', onKeydown);
  }

  renderHistory();
  render();
})();
</script>
</body>
</html>
